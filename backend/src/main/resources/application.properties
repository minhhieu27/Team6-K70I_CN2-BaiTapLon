# ==========================================
# 1. CẤU HÌNH H2 DATABASE (TEST TRÊN RAM)
# ==========================================
spring.datasource.url=jdbc:h2:mem:auctiondb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Mở cổng giao diện Web để tự vào xem Database (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# 2. CẤU HÌNH HIBERNATE (TỰ ĐỘNG ĐẺ TABLE)
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# 3. CẤU HÌNH CLOUDINARY (UPLOAD ẢNH) - GIỮ NGUYÊN CỦA THẰNG HIẾU
# ==========================================

# ==========================================
# 4. PORT SERVER - GIỮ NGUYÊN
# ==========================================
server.port=${PORT:8080}

