version: '3.9'

services:

  mysql:
    image: mysql:8.0
    container_name: auction-mysql

    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: auction

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: auction-app

    ports:
      - "8080:8080"

    depends_on:
      mysql: 
        condition: service_healthy

    env_file:
      - .env

volumes:
  mysql_data: