<!DOCTYPE html>
<html>
<head>
    <title>Sàn Đấu Giá UET</title>
    <style>
        .product-card { border: 1px solid #ccc; padding: 20px; width: 300px; border-radius: 10px; }
        button { background: #28a745; color: white; border: none; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Sàn Đấu Giá Sinh Viên UET</h1>
    <div id="product-list">
        </div>

    <script>
        // Logic lấy dữ liệu từ server Node.js về giao diện
        fetch('/products')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('product-list');
                data.forEach(p => {
                    list.innerHTML += `
                        <div class="product-card">
                            <h2>${p.name}</h2>
                            <p>Giá hiện tại: <b>$${p.price}</b></p>
                            <p>${p.description}</p>
                            <button onclick="alert('Bác đã trả giá thành công!')">Trả giá ngay</button>
                        </div>
                    `;
                });
            });
    </script>
</body>
</html>
